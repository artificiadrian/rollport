# Builds the site and publishes it on GitHub Pages. The site shows the real
# app in its demo, so a change to the app rebuilds it too.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "static/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "svelte.config.ts"
      - "vite.config.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one that is waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is not published from a commit that fails the checks.
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  build:
    name: Build the site
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo and the share image are made in a headless browser.
      # With the system libraries Chromium needs on Ubuntu.
      - run: pnpm --dir site exec playwright install --with-deps chromium

      - run: pnpm --dir site build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Publish the site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Every push, tag and pull request: the checks run once, then fan out. On
# main the site is published (site.yml); on a version tag Rollport is built
# for every system (release.yml). Neither starts if a check fails.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Publishes the site again by hand, after the checks, when run on main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Window and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm check

      - run: pnpm test

      - run: pnpm --dir site check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      # The Rust side embeds the window's build, so it has to exist first.
      - run: pnpm build

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

  site:
    name: Site
    needs: [web, rust]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  release:
    name: Release
    needs: [web, rust]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
